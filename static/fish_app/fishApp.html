		<style>

		html,
		body {
			margin: 0;
			padding: 0;

			display: flex;
			justify-content: space-between;
			/* left/right */
			align-items: flex-start;
			/* top */

			background-color: #333333;
		}

		canvas {
			display: block;
			outline: none;
		}

		.container {
			max-width: 800px;
			/* or whatever you prefer */
			margin: 0 auto;
			padding: 0 1rem;
			text-align: center;
		}

		#sketch-container {
			position: relative;
			/* or fixed if you want it to stay on screen while scrolling */
			top: 0;
			left: 0;
			width: 100%;
			/* or 100% for full width */
			height: 100%;
			/* or 100% for full height */
			/* border: 1px solid #ccc; */
		}

		body {
			margin: 0;
			padding: 0;
			font-family: Arial, sans-serif;
		}

		#canvas-container {
			width: 100%;
			height: 100vh;
		}

		nav {
			width: 0%;
			min-width: 100px;
			/* Prevents it from getting too narrow */
			background-color: #222;
			padding: 20px;
			box-sizing: border-box;
			overflow-y: auto;
			/* In case you add lots of links */
		}

		nav a {
			display: block;
			color: #fff;
			text-decoration: none;
			padding: 10px 0;
			transition: color 0.2s;
		}

		nav a:hover {
			color: #4caf50;
		}

			.nav-button {
				position: fixed;
				top: 20px;
				left: 20px;
				padding: 10px 20px;
				background-color: rgba(0, 0, 0, 0.7);
				color: white;
				text-decoration: none;
				border-radius: 5px;
				font-family: Arial, sans-serif;
				z-index: 1000;
			}

			.nav-button:hover {
				background-color: rgba(0, 0, 0, 0.9);
			}
		</style>
